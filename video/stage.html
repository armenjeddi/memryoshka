<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memryoshka video stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=block">
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<!-- A 1920 x 1080 stage for the videos. render.py calls window.renderAt(t) for every frame and takes a screenshot.
     Open it in a browser with ?video=intro&t=12.5 to inspect one moment. -->
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="../assets/data/results.js"></script>
<script src="../assets/data/code.js"></script>
<script src="../assets/data/frames.js"></script>
<script src="../assets/data/stream.js"></script>
<script src="assets/wave.js"></script>
<script src="stage-common.js"></script>
<script src="scenes-intro.js"></script>
<script src="scenes-arch.js"></script>
<script>
  // render.py calls V.setup(name, timing) itself. When the folder is served over http, ?video=intro&t=12.5 shows one moment.
  (async function () {
    const q = new URLSearchParams(location.search);
    if (!q.get("t")) return;
    const which = q.get("video") || "intro";
    const timing = await (await fetch("build/" + which + "_timing.json")).json();
    await V.setup(which, timing);
    window.renderAt(parseFloat(q.get("t")));
  })();
</script>
</body>
</html>
