[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memryoshka"
dynamic = ["version"]
description = "Memryoshka: Adaptive-Fidelity Video Memory for Streaming VLMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Versions used for the paper's runs.
dependencies = [
    "numpy==2.4.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.14.1",
    "huggingface_hub==1.28.0",
    "av==16.1.0",
    "pillow==12.1.0",
    "ftfy==6.3.1",
    "regex==2026.1.15",
    "tqdm>=4.66",
    "packaging",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["memryoshka*"]

[tool.setuptools.package-data]
memryoshka = ["assets/*"]

[tool.setuptools.dynamic]
version = { attr = "memryoshka.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
