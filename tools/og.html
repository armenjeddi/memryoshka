<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #ffffff; font-family: Inter, sans-serif; color: #14181f; }
  .wrap { box-sizing: border-box; height: 630px; padding: 70px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 36px; }
  .top img { height: 150px; }
  h1 { font: 500 104px/1 Newsreader, serif; letter-spacing: -0.02em; margin: 0; }
  .sub { font: italic 400 38px/1.25 Newsreader, serif; color: #4a505b; margin-top: 18px; }
  .line { font-size: 27px; color: #4a505b; line-height: 1.45; max-width: 1000px; }
  .bar { display: flex; gap: 3px; height: 14px; margin-top: 26px; }
  .bar i { flex: 1; border-radius: 3px; }
</style></head>
<body><div class="wrap">
  <div>
    <div class="top"><img src="../assets/img/logo.svg" alt=""><h1>Memryoshka</h1></div>
    <div class="sub">Adaptive-Fidelity Video Memory for Streaming VLMs</div>
  </div>
  <div>
    <div class="line">A training-free video memory that can shorten stored token codes instead of deleting them. 7.2 MB for the whole stream.</div>
    <div class="bar"><i style="background:#88b5f2"></i><i style="background:#609ae7"></i><i style="background:#3b7fd6"></i><i style="background:#1f65b9"></i><i style="background:#124d93"></i><i style="background:#0d376a"></i></div>
  </div>
</div></body></html>
